name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly dependency audit

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the job token out of .git/config, where
      # every later step in the job could read it. No job here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No `version:` here — the action reads package.json "packageManager".
      # Specifying both makes the action error before install.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  audit:
    name: dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Blocking, per security requirement 8.
      - run: pnpm audit --prod --audit-level high

  snyk:
    name: snyk (reported, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Snyk CLI image, pinned by DIGEST. This container is the code that
      # sees SNYK_TOKEN, and a tag (snyk/snyk:node) can be repointed while a
      # digest cannot. Replaces snyk/actions/node, whose action.yml runs that
      # image by mutable tag. Same command and env as the action. Dependabot
      # cannot update a digest inside `run:`; bump by hand per
      # docs/SECURITY.md ("Bumping the Snyk image digest").
      - name: snyk test (snyk/snyk:node, digest-pinned)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          docker run --rm
          -e SNYK_TOKEN -e FORCE_COLOR=2
          -e SNYK_INTEGRATION_NAME=GITHUB_ACTIONS -e SNYK_INTEGRATION_VERSION=node
          -v "$PWD:/project" -w /project
          snyk/snyk:node@sha256:1dd473f4936eaf1e8d2f4068aab09638faaaa8e8085a7ac999aa968c31372a0c
          snyk test

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  hidden-chars:
    name: hidden-character scan (Trojan Source, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Every tracked text file, not just src/. ESLint's bidi rule only sees
      # JS/TS under src/, which is how a literal U+2066 once reached spikes/.
      # No install step: the script has no dependencies.
      - run: node scripts/check-hidden-chars.mjs
